<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과몰입구역</title>
<meta name="description" content="DISC 행동유형 검사, 성인 ADHD 성향 체크, 반응속도 게임. 나는 어떤 유형일까?">
<!-- referrer 정책: 결과 페이지 경로(/test/disc/result 등)가 광고 스크립트를 포함한
     외부 도메인으로 그대로 새어나가지 않도록 origin까지만 보낸다. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- 정적 사이트라 페이지별 동적 미리보기가 안 된다. 이 태그는 모든 주소에 공통으로
     적용되므로 특정 테스트 이름을 넣으면 다른 테스트 링크가 엉뚱하게 미리보기된다.
     결과별 미리보기가 필요하면 결과 주소마다 정적 셸을 만들어야 한다. -->
<meta property="og:type" content="website">
<meta property="og:title" content="과몰입구역 - 심리테스트 · 미니게임">
<meta property="og:description" content="DISC 행동유형 검사부터 반응속도 게임까지. 나는 어떤 유형일까?">
<meta property="og:url" content="https://fun.data-pantry.com/">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fastly.jsdelivr.net" />
<link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="/styles.css" />
<!-- AdFit 로더(ba.min.js)는 여기서 부르지 않는다. 실행 시점의 문서만 훑는 스크립트라
     화면을 갈아끼우는 SPA에서는 빈 #app을 훑고 끝난다. 슬롯을 그린 직후 슬롯마다
     붙이는 일은 js/core/ads.js의 mountAds()가 한다. 여기서는 연결만 미리 열어둔다. -->
<link rel="preconnect" href="https://t1.daumcdn.net" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
