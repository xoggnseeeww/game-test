<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과몰입구역</title>
<meta name="description" content="직장인 유형검사, 성인 ADHD 성향 체크, 반응속도 게임. 나는 어떤 유형일까?">
<!-- referrer 정책: 결과 페이지 경로(/test/disc/result 등)가 광고 스크립트를 포함한
     외부 도메인으로 그대로 새어나가지 않도록 origin까지만 보낸다. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<!-- 정적 사이트라 페이지별 동적 미리보기가 안 된다. 이 태그는 모든 주소에 공통으로
     적용되므로 특정 테스트 이름을 넣으면 다른 테스트 링크가 엉뚱하게 미리보기된다.
     결과별 미리보기가 필요하면 결과 주소마다 정적 셸을 만들어야 한다. -->
<meta property="og:type" content="website">
<meta property="og:title" content="과몰입구역 - 심리테스트 · 미니게임">
<meta property="og:description" content="직장인 유형검사부터 반응속도 게임까지. 나는 어떤 유형일까?">
<meta property="og:url" content="https://fun.data-pantry.com/">
<meta property="og:image" content="https://fun.data-pantry.com/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="과몰입구역 - 나는 어떤 유형일까?">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://fun.data-pantry.com/assets/og-image.png">
<link rel="preconnect" href="https://fastly.jsdelivr.net" />
<link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="/styles.css" />
<!-- ba.min.js는 로드되는 시점의 DOM만 스캔한다. 이 태그 자체는 최초 화면분만 채우고,
     화면 전환마다 새로 생기는 광고 슬롯은 js/core/ads.js의 refreshAds()가 이 태그를
     통째로 갈아끼워 재스캔시킨다(js/core/router.js의 render() 끝에서 호출) —
     그래서 태그를 지우면 안 된다, refreshAds()가 갈아끼울 대상 자체가 없어진다. -->
<script type="text/javascript" src="//t1.daumcdn.net/kas/static/ba.min.js" async></script>
<!-- 우상단 관리자 로그인(js/core/auth.js)이 쓰는 Google Identity Services. Client ID는
     public 값이라 여기 노출돼도 안전하지만, 실제 로그인 버튼이 뜨려면 Google Cloud
     Console에서 발급받은 값을 auth.js의 GOOGLE_CLIENT_ID에 채워 넣어야 한다. -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
